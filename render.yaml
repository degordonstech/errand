# Render Blueprint. Values marked sync: false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: errand
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

      - key: META_API_BASE_URL
        value: https://api.meta.ai/v1
      - key: MUSE_SPARK_MODEL
        value: muse-spark-1.3
      - key: MUSE_TRANSCRIBE_MODEL
        value: muse-voice-transcribe-1.0
      - key: META_API_KEY
        sync: false

      - key: WHATSAPP_GRAPH_VERSION
        value: v23.0
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: ALLOWED_NUMBERS
        sync: false

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Errand <onboarding@resend.dev>
      # While set, every email goes to this inbox instead of the real recipient.
      - key: DEV_EMAIL_TO
        sync: false

      - key: CRON_SECRET
        sync: false
